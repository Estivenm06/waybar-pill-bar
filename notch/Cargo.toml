[package]
name = "waybar-notch"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
chrono = "0.4.45"
futures-lite = "2.6.1"
gtk4 = { version = "0.11.5", features = ["v4_12"] }
gtk4-layer-shell = "0.8.1"
libc = "0.2"
nix = { version = "0.30.1", features = ["fs", "signal", "process"] }
regex = "1"
serde_json = "1.0.154"
ureq = "3.5.1"
zbus = "6.2.1"

[profile.release]
opt-level = 3
lto = true
strip = true
