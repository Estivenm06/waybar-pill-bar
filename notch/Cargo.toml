[package]
name = "waybar-notch"
version = "0.1.0"
edition = "2024"

[dependencies]
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop = { version = "0.14", features = ["signals"] }
tiny-skia = "0.12"
cosmic-text = "0.19"
sha2 = "0.11"
url = "2"
base64 = "0.23.1"
chrono = "0.4.45"
getrandom = "0.4.3"
libc = "0.2"
nix = { version = "0.30.1", features = ["fs", "signal", "process"] }
regex = "1"
serde_json = "1.0.154"
ureq = "3.5.1"
zbus = "6.2.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 3
lto = true
strip = true
