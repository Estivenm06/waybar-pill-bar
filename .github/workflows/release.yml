name: Prebuilt notch

# Publishes candidate notch builds (GitHub release notch-<commit>); a candidate is never overwritten.
# Installs trust a binary only after a maintainer reviews the printed candidate pin and commits it as
# files/setup/prebuilt.json. A pin-only commit does not trigger another candidate.
#   verify  : check that the committed pin authorizes an artifact for the sources of this commit (changes nothing)
#   publish : test the commit, then build and publish a candidate and print its pin
on:
  push:
    branches: [main]
    paths: ["notch/**", "manifest.json", "release.sh", "files/setup/source-hash.sh", ".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "verify = check the committed pin; publish = publish a new candidate for this commit and print its pin"
        type: choice
        options: [verify, publish]
        default: verify

permissions:
  contents: write

jobs:
  notch:
    runs-on: ubuntu-latest
    # built on Arch so the binary links against the libraries Omarchy users have
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel git rust jq zstd curl github-cli libxkbcommon wayland pkgconf fontconfig ttf-jetbrains-mono ttf-dejavu
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify the committed pin
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'verify'
        run: ./release.sh --verify
      - name: Publish candidate (pin needs review)
        if: github.event_name == 'push' || inputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./release.sh --publish
