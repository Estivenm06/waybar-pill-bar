# Managed by waybar-pill-bar (installed as ~/.config/systemd/user/waybar.service.d/50-waybar-notch.conf)
# waybar.service runs the supervisor, which keeps one Waybar per output and shows only the notch's output.
[Service]
ExecStart=
ExecStart=%h/.local/bin/waybar-notch --waybar-supervisor
ExecReload=
ExecReload=/bin/kill -SIGUSR2 $MAINPID
# The supervisor stops its own workers; apps that were started from the bar and still sit in this cgroup survive.
KillMode=process
TimeoutStopSec=5
UnsetEnvironment=GDK_SCALE GDK_DPI_SCALE
